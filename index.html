<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alem — задачи бизнеса и студенты</title>
  <meta name="description" content="Открытый каталог практических задач бизнеса. Студенты выбирают проекты, бизнес выбирает исполнителей.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231633cf'/%3E%3Ctext x='15' y='47' fill='white' font-size='45' font-family='Arial'%3Ea%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="demo">
    <span>Демо MVP · Задачи и отклики сохраняются в этом браузере. Вход и проверка студентов имитируются.</span>
    <label style="display:flex;align-items:center;gap:10px;margin:0;color:white;font-size:13px">
      Посмотреть как
      <select id="role" aria-label="Демонстрационная роль">
        <option value="guest">Гость</option>
        <option value="student">Студент · подтверждён</option>
        <option value="pending">Студент · на проверке</option>
        <option value="business">Бизнес · свой кабинет</option>
        <option value="moderator">Модератор</option>
      </select>
    </label>
  </div>

  <header>
    <a class="logo" href="#catalog">alem<span>.</span></a>
    <nav id="nav"></nav>
    <button id="account" onclick="auth()">Войти / Регистрация</button>
  </header>

  <main id="app" class="shell"></main>

  <dialog id="modal"></dialog>
  <div id="toast" role="status" hidden></div>

  <script>
    if (location.protocol === 'file:') {
      document.querySelector('#app').textContent = 'Откройте сайт через start.bat или python server.py. Прямое открытие HTML не поддерживает модули и AI. Адрес сервера: http://127.0.0.1:8000/';
    } else {
      const entry = document.createElement('script');
      entry.type = 'module'; entry.src = 'js/bootstrap.mjs';
      document.body.append(entry);
    }
  </script>
</body>
</html>
